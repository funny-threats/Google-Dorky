[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "googledorky"
version = "1.0.0"
description = "Automated Google Dork SQL Injection Scanner for Bug Bounty Hunting"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["security", "pentesting", "bug-bounty", "sql-injection", "google-dork"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "selenium>=4.15.2",
    "fake-useragent>=1.4.0",
    "urllib3>=2.1.0",
    "colorama>=0.4.6",
    "tqdm>=4.66.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
googledorky = "main:main"

[project.urls]
Homepage = "https://github.com/yourusername/Googledorky"
Documentation = "https://github.com/yourusername/Googledorky#readme"
Repository = "https://github.com/yourusername/Googledorky"
Issues = "https://github.com/yourusername/Googledorky/issues"

[tool.setuptools]
packages = []

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']

[tool.pylint]
max-line-length = 100
